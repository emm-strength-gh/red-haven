<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Body Mechanics — pose and animate an artist's mannequin with human joint limits and adjustable proportions." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/src/mechanics.css" />
    <title>Body Mechanics — Pose Studio</title>
  </head>
  <body>
    <main id="app">
      <div id="stage" aria-label="3D posing studio: drag a body part to pose it, drag the background to orbit"></div>

      <header class="topbar">
        <a class="home" href="index.html">← Games</a>
        <div class="brand">Body Mechanics <small>Pose studio</small></div>
        <div class="top-actions">
          <button class="icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↶</button>
          <button class="icon-btn" id="mirrorPose" title="Mirror pose" aria-label="Mirror pose">⇋</button>
          <button class="icon-btn" id="resetPose" title="Reset to neutral" aria-label="Reset pose">↺</button>
          <button class="icon-btn mobile-only" id="panelToggle" aria-label="Open controls">☰</button>
        </div>
      </header>

      <nav class="views" aria-label="Camera views">
        <button data-view="front">Front</button>
        <button data-view="side">Side</button>
        <button data-view="three" class="active">¾</button>
        <button data-view="back">Back</button>
      </nav>

      <div class="hint" id="hint"></div>

      <aside class="panel" id="panel">
        <div class="panel-head">
          <nav class="tabs" aria-label="Body Mechanics tools">
            <button class="active" data-tab="pose">Pose</button>
            <button data-tab="proportions">Proportions</button>
            <button data-tab="sequence">Animate</button>
          </nav>
          <button class="close mobile-only" id="panelClose" aria-label="Close controls">×</button>
        </div>

        <div class="tab active" id="tab-pose">
          <section>
            <h2>Presets</h2>
            <div class="chip-grid" id="presets"></div>
          </section>

          <section>
            <div class="section-head"><h2 id="jointTitle">Joints</h2><button class="text-btn" id="resetJoint" hidden>Reset joint</button></div>
            <div id="jointPicker" class="picker"></div>
            <div id="jointSliders" class="sliders"></div>
          </section>

          <section>
            <h2>Hands</h2>
            <div class="segmented" id="handStyle"></div>
          </section>

          <section>
            <h2>Whole body</h2>
            <div class="sliders" id="bodySliders"></div>
          </section>
        </div>

        <div class="tab" id="tab-proportions">
          <section>
            <h2>Proportions</h2>
            <p class="note">Change limb and torso lengths. Every joint angle stays attached.</p>
            <div class="sliders" id="proportionSliders"></div>
            <button class="wide-btn" id="resetProportions">Reset proportions</button>
          </section>
        </div>

        <div class="tab" id="tab-sequence">
          <section>
            <div class="section-head"><h2>Pose sequence</h2><span class="muted" id="poseCount">0 saved</span></div>
            <p class="note">Save poses in order. Playback blends smoothly between them.</p>
            <div class="sequence-actions">
              <button class="wide-btn accent" id="addPose">＋ Add current pose</button>
              <button class="wide-btn" id="updatePose" disabled>Update selected</button>
            </div>
            <div class="pose-list" id="poseList"></div>
          </section>
          <section>
            <div class="slider-row">
              <label for="poseDuration"><span>Seconds per pose</span><output id="poseDurationOut">1.2s</output></label>
              <input id="poseDuration" type="range" min="0.4" max="3" step="0.1" value="1.2" />
            </div>
            <label class="check"><input id="loopPlayback" type="checkbox" checked /><span></span>Loop sequence</label>
          </section>
        </div>
      </aside>

      <div class="transport">
        <button class="play" id="playSequence" aria-label="Play sequence">▶</button>
        <div class="transport-copy"><b id="transportTitle">Sequence</b><small id="transportStatus"></small></div>
        <button class="stop" id="stopSequence" aria-label="Stop" disabled>■</button>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </main>
    <script type="module" src="/src/mechanics.js"></script>
  </body>
</html>
